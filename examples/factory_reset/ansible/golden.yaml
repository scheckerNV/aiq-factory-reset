# This is the Schecker Test Cluster's Desired State Configuration
# This is a YAML file that defines the desired state of the cluster

metadata:
  version: "1.0.0"
  description: "Schecker Test Cluster Desired State"
  created: "2025-01-26"
  environment: "test"
  cluster_name: "schecker-test-cluster"
  total_nodes: 11

# ==============================================================================
# CLUSTER CONFIGURATION
# ==============================================================================
cluster:
  name: "schecker-test-cluster"
  type: "Test_Cluster"
  location: "virtualized-environment"

  # Head Node Configuration
  head_node:
    enabled: true
    hostname: "schecker-test-cluster"
    management_ip: "10.141.255.254"
    external_ip: "192.168.200.148"
    mac_address: "FA:16:3E:22:16:50"
    domain: "cluster.local"
    default_image: "default-cluster-image"

# ==============================================================================
# NETWORK FABRIC DEFINITIONS
# ==============================================================================
network_fabrics:
  # Management Network (Internal)
  management:
    name: "internalnet"
    aliases: ["managementnet"]
    subnet: "10.141.0.0/16"
    gateway: "10.141.255.254"
    dns_servers: ["127.0.0.53", "192.168.200.254"]
    usable_range: "10.141.0.1-254"
    description: "Internal cluster management network"

  # External Network
  external:
    name: "externalnet"
    aliases: ["publicnet"]
    subnet: "192.168.200.0/24"
    gateway: "192.168.200.254"
    dns_servers: ["192.168.200.254"]
    usable_range: "192.168.200.1-253"
    description: "External connectivity network"

  # Global Network (Control Plane)
  global:
    name: "globalnet"
    aliases: ["controlnet"]
    subnet: "0.0.0.0/0"
    gateway: null
    description: "Global routing network"

# ==============================================================================
# COMPUTE NODE DEFINITIONS (10 nodes)
# ==============================================================================
nodes:
  # Standard references for all compute nodes
  node_power: &node_power
    desired_state: "on"
    power_policy: "restore_previous"
    auto_power_on: true

  node_software: &node_software
    os_image: "cluster-os-latest"
    kernel_version: "latest"
    container_runtime: "docker"
    cluster_enrolled: true
    monitoring_enabled: true

  node_health: &node_health
    temperature_thresholds:
      cpu_critical: 85
      cpu_warning: 75
    memory_thresholds:
      memory_usage_critical: 95
      memory_usage_warning: 85
    network_thresholds:
      connectivity_timeout: "5s"
      max_packet_loss: 0.01

  # Compute Nodes (node001 through node010)
  node001:
    hostname: "node001"
    model: "Virtual_Node"
    serial_number: "VIRT_001"
    networks:
      management:
        ip: "10.141.0.1"
        mac: "FA:16:3E:A5:57:C2"
        interface: "ens3"
        gateway: "10.141.255.254"
        dns: ["127.0.0.53"]
    power: *node_power
    software: *node_software
    health: *node_health

