# ==============================================================================
# INFRASTRUCTURE COMPONENTS
# ==============================================================================
infrastructure:
  # Head Node Services
  head_node_services:
    cluster_management:
      hostname: "schecker-test-cluster"
      management_ip: "10.141.255.254"
      external_ip: "192.168.200.148"
      services:
        - "cluster_manager"
        - "nfs_server"
        - "ldap_server"
        - "dns_server"
        - "dhcp_server"
        - "monitoring"

  # Network Infrastructure (Virtualized)
  virtualization:
    platform: "openstack"
    network_type: "virtual_ethernet"
    description: "Virtualized test environment"

# ==============================================================================
# CLUSTER-WIDE POLICIES
# ==============================================================================
policies:
  # Node Management
  node_management:
    boot_timeout: "5m"
    max_power_resets: 5
    connectivity_check_interval: "60s"
    auto_recovery: true

  # Network Policies
  network:
    ethernet:
      mtu: 1500
      spanning_tree_enabled: false
      monitoring_enabled: true
      connectivity_threshold: "1s"

  # Health Monitoring
  monitoring:
    health_check_interval: "30s"
    cluster_health_threshold: 0.90
    node_isolation_threshold: 2
    alert_escalation_time: "10m"

# ==============================================================================
# AUTOMATION WORKFLOWS
# ==============================================================================
automation:
  # Node Lifecycle Management
  node_lifecycle:
    provision:
      - "power_on"
      - "network_check"
      - "os_boot"
      - "service_start"
      - "health_check"

    recovery:
      - "assess_node_state"
      - "power_cycle"
      - "network_reset"
      - "service_restart"
      - "health_validation"

  # Cluster Operations
  cluster_operations:
    connectivity_test:
      interval: "10m"
      timeout: "5s"
      max_retries: 3

# ==============================================================================
# SECURITY CONFIGURATION
# ==============================================================================
security:
  authentication:
    method: "local"
    domain: "cluster.local"

  access_control:
    admin_groups:
      - "cluster_admins"
    user_groups:
      - "cluster_users"

  network_security:
    internal_only: true
    external_access_restricted: true

# ==============================================================================
# OPERATIONAL PROCEDURES
# ==============================================================================
procedures:
  node_recovery:
    trigger_conditions:
      - "boot_timeout"
      - "connectivity_loss"
      - "service_failure"
    recovery_steps:
      1: "diagnose_issue"
      2: "attempt_power_cycle"
      3: "network_reset"
      4: "manual_intervention"

  cluster_maintenance:
    maintenance_window:
      day: "sunday"
      start_time: "02:00"
      duration_hours: 4

  capacity_planning:
    current_capacity:
      total_nodes: 11
      active_nodes: 10
      down_nodes: 1
    monitoring_metrics:
      - "node_availability"
      - "network_latency"
      - "service_status"

# ==============================================================================
# CURRENT CLUSTER STATE
# ==============================================================================
current_status:
  timestamp: "2025-08-26T20:34:35+02:00"

  cluster_health:
    total_devices: 11
    active_devices: 10
    down_devices: 1
    overall_status: "degraded"

  network_status:
    networks_configured: 3
    connectivity_ok: 1068
