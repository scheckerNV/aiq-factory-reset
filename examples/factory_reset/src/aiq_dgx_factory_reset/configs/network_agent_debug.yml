# Debug configuration with enhanced logging and live execution

general:
  use_uvloop: true

functions:
  # BCM Documentation RAG Tool with DEBUG settings
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    max_tokens: 4096
    response_mode: "compact"  # More efficient than tree_summarize
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"
    similarity_top_k: 3  # Reduced for better focus

  networking_expert_rag:
    _type: aiq_dgx_factory_reset/networking_expert_rag
    max_tokens: 4096
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"
    similarity_top_k: 3  # Reduced for better focus

  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/cluster_assessment_*"

  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "🔧 DEBUG EXECUTION - Review these BCM commands for schecker-testcluster (LIVE EXECUTION ENABLED)"

  bcm_executor:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 600
    dry_run: false
    hitl_approval_fn: hitl_code_approval

  # NEW: Network config extractor
  network_config_extractor:
    _type: aiq_dgx_factory_reset/network_config_extractor
    networking_docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"

  # Simple orchestrator without embedded logic
  simple_network_orchestrator:
    _type: aiq_dgx_factory_reset/simple_network_orchestrator

llms:
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  execution_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: aiq_dgx_factory_reset/network_factory_reset_orchestrator
