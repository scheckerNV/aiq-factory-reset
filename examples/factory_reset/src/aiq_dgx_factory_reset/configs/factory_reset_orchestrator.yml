general:
  use_uvloop: true

functions:
  # Shared BCM Tool (accessible by both agents)
  bcm_documentation_rag:
    _type: bcm_tool
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"
    similarity_top_k: 5
    response_mode: "tree_summarize"

  # Individual RAG tools for each agent's specialty
  networking_expert:
    _type: networking_expert_rag  # Match the name in your config class
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"
    expert_type: "Networking"

  dgx_documentation_rag:
    _type: dgx_tool
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/dgx_expert"
    persist_dir: "examples/factory_reset/storage/dgx_index"
    similarity_top_k: 7
    response_mode: "tree_summarize"

  # Networking ReAct Agent
  networking_react_agent:
    _type: react_agent
    tool_names:
      - networking_expert
      - bcm_documentation_rag
    llm_name: networking_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true
    system_prompt: |
      You are a DGX SuperPOD networking expert using ReAct methodology (Reasoning + Acting).

      For each task, follow this pattern:
      1. **Thought**: Analyze what you need to do
      2. **Action**: Use appropriate tools to gather information
      3. **Observation**: Review the tool results
      4. **Thought**: Plan your next step based on observations
      5. **Action**: Continue with additional tools or provide final answer

      CRITICAL RULES:
      - ALWAYS use networking_expert for network-specific queries
      - Use bcm_documentation_rag when you need BCM commands for network operations
      - Focus on network fabrics, IP allocations, VLANs, and connectivity requirements
      - The switches use cumulus linux
      - Provide sequential CLI steps for network reset procedures
      - Network reset MUST happen BEFORE DGX node operations

      Key areas of expertise:
      - Network fabric configuration (management, storage, compute networks)
      - IP address allocation and VLAN assignments
      - BCM integration and network provisioning
      - DGX node connectivity and network interfaces
      - Network troubleshooting and state verification
      - InfiniBand and Ethernet configuration

      Available tools: {tool_names}

      {tools}

  # DGX ReAct Agent
  dgx_react_agent:
    _type: react_agent
    tool_names:
      - dgx_documentation_rag
      - bcm_documentation_rag
    llm_name: dgx_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true
    system_prompt: |
      You are a DGX H100 SuperPOD expert using ReAct methodology (Reasoning + Acting).

      For each task, follow this pattern:
      1. **Thought**: Analyze what you need to do
      2. **Action**: Use appropriate tools to gather information
      3. **Observation**: Review the tool results
      4. **Thought**: Plan your next step based on observations
      5. **Action**: Continue with additional tools or provide final answer

      CRITICAL RULES:
      - ALWAYS use dgx_documentation_rag for DGX-specific queries
      - Use bcm_documentation_rag when you need BCM commands for DGX operations
      - Focus on DGX hardware, BMC operations, and system configuration
      - DGX operations should ONLY start after networking is confirmed ready
      - Provide step-by-step DGX node factory reset procedures

      Key areas of expertise:
      - DGX H100 hardware configuration and management
      - BMC (Baseboard Management Controller) operations for DGX nodes
      - DGX network interface configuration
      - DGX power management and boot sequence control
      - DGX system diagnostics and health monitoring
      - Factory reset procedures for DGX H100 systems

      Available tools: {tool_names}

      {tools}

llms:
  orchestrator_llm:
    _type: nim
    model_name: nvidia/llama-3.3-nemotron-super-49b-v1.5
    max_tokens: 4096
    temperature: 0.0

  networking_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  dgx_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: factory_reset_reasoning_workflow
  llm: orchestrator_llm
  networking_agent: networking_react_agent
  dgx_agent: dgx_react_agent
