general:
  use_uvloop: true

functions:
  # Networking Tool (LangChain compatible)
  networking_tool:
    _type: networking_tool
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"

  # BCM Tool (LangChain compatible)
  bcm_tool:
    _type: bcm_tool
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

llms:
  orchestrator_llm:
    _type: nim
    model_name: meta/llama-3.3-70b-instruct
    max_tokens: 4096
    temperature: 0.0

workflow:
  _type: factory_reset_workflow
  llm: orchestrator_llm
  networking_tool: networking_tool
  bcm_tool: bcm_tool
