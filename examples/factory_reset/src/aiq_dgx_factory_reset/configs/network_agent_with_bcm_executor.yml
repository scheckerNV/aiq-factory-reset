# Network Agent workflow integrated with BCM Command Executor
# This shows how the network assessment -> BCM commands -> code execution flow works

general:
  use_uvloop: true

functions:
  # Network Assessment Function (existing)
  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    output_dir: /tmp
    timeout: 300

  # Network Results Reader (existing)
  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader

  # BCM Documentation RAG (existing)
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag

  # Networking Expert RAG (existing)
  networking_expert_rag:
    _type: aiq_dgx_factory_reset/networking_expert_rag

  # NEW: Human-in-the-Loop Approval Function
  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "🔧 BCM FACTORY RESET COMMANDS - The following commands will execute network changes on your DGX cluster"

  # NEW: BCM Command Execution Tool with Human Approval
  bcm_executor:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "schecker-testcluster"  # Your cluster hostname
    cluster_user: "root"                   # Your cluster username
    timeout: 600                          # Longer timeout for complex operations
    dry_run: true                         # Set to false when ready for live execution
    coder_llm_name: qwen_coder           # Qwen2.5 for validation
    hitl_approval_fn: hitl_code_approval

llms:
  # Reasoning agent LLM
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  # Network expert LLM
  network_expert_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.3

  # NEW: Qwen2.5 Coder for command validation
  qwen_coder:
    _type: nim
    model_name: nvidia/qwen2.5-coder-32b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: reasoning_agent
  agent_type: network_expert
  agent_llm: reasoning_llm
  think_step_llm: reasoning_llm
  tools:
    - network_assessment_tool
    - network_results_reader
    - networking_expert_rag
    - bcm_documentation_rag
    - bcm_executor  # NEW: Added BCM executor to available tools
