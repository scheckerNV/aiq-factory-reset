  # network_assessment_tool:
  #   _type: aiq_dgx_factory_reset/network_assessment_tool
  #   cluster_host: "localhost"
  #   cluster_user: "root"
  #   timeout: 300

  # BCM Documentation RAG Tool with LlamaParse and Multi-Agent Workflow
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

  # DGX Expert RAG Tool with LlamaParse and Multi-Agent Workflow
  dgx_expert_rag:
    _type: aiq_dgx_factory_reset/dgx_expert_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/dgx_expert"
    persist_dir: "examples/factory_reset/storage/dgx_index"

  # Assess state of nodes in cluster
  node_assessment_tool:
    _type: aiq_dgx_factory_reset/node_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  # Read results of node assessment
  node_results_reader:
    _type: aiq_dgx_factory_reset/node_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/node_assessment_*"

  networking_expert_rag:
    _type: aiq_dgx_factory_reset/networking_expert_rag
    max_tokens: 8192
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"

  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/cluster_assessment_*"

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 2048
    temperature: 0.0

workflow:
  _type: react_agent
  tool_names:
    - bcm_documentation_rag
    - dgx_expert_rag
    - node_assessment_tool
    - node_results_reader
    - networking_expert_rag
    - network_assessment_tool
    - network_results_reader
  llm_name: nim_llm
  verbose: true
  system_prompt: |
    You are an analysis-only cluster assistant. Provide factual answers about current cluster state.

    Available tools:
    {tools}
    Tool names: {tool_names}

    Use the ReAct format exactly:
    Thought: brief reasoning about the next step
    Action: one of {tool_names}
    Action Input: JSON arguments for the tool
    Observation: tool result (will be provided by the system)
    ... (repeat Thought/Action/Action Input/Observation as needed)
    Final Answer: the final concise answer with any recommendations and a short Sources list

    Guidance:
    - Prefer reading current results first:
      1) Try network_results_reader or node_results_reader with a relevant keyword (e.g., "all", "devices", "firmware", "bmc", "full").
      2) If results are missing or stale, run the corresponding assessment tool (network_assessment_tool or node_assessment_tool) and then re-read.
    - Use RAG tools (bcm_documentation_rag, dgx_expert_rag) for corroboration, definitions, and procedures — not as the primary source of live measurements.
    - Do not execute any state-changing commands. Only collect, read, and summarize.
    - Keep thoughts concise. Always include an Action after each Thought until you can produce a Final Answer.
    - In Final Answer, add a short "Sources:" line summarizing which tools/files you used.
