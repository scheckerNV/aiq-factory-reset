general:
  use_uvloop: true

functions:
  # RAG (read-only)
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

  dgx_expert_rag:
    _type: aiq_dgx_factory_reset/dgx_expert_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/dgx_expert"
    persist_dir: "examples/factory_reset/storage/dgx_index"

  # Assess (collects data; no state changes)
  node_assessment_tool:
    _type: aiq_dgx_factory_reset/node_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  # Readers (read-only)
  node_results_reader:
    _type: aiq_dgx_factory_reset/node_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/node_assessment_*"

  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/cluster_assessment_*"


  # ReAct agent used by the orchestrator
  dgx_react_agent:
    _type: react_agent
    llm_name: nim_llm
    verbose: true
    retry_agent_response_parsing_errors: true
    parse_agent_response_max_retries: 3
    tool_names:
      - node_assessment_tool
      - node_results_reader
      - network_assessment_tool
      - network_results_reader
      - dgx_expert_rag
      - bcm_documentation_rag
    system_prompt: |
      You are an analysis-only cluster assistant. Do not execute any state-changing commands.

      Available tools:
      {tools}
      Tool names: {tool_names}

      Always follow ReAct format and NEVER output “Action: None”.

      Sequence:
      1) Action: node_assessment_tool with input "Run DGX node assessment and save results"
      2) Action: node_results_reader with input {{"query":"all"}}
      3) Optionally, network_assessment_tool → network_results_reader if the query requires network state
      4) Use BCM/DGX RAG for corroboration/definitions only

      Output all relevant information and be as detailed as possible. Finish with Final Answer and Sources.

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 2048
    temperature: 0.0

workflow:
  _type: aiq_dgx_factory_reset/dgx_orchestrator
  reasoning_llm_name: nim_llm
  react_agent_fn: dgx_react_agent
  retry_agent_response_parsing_errors: true
  parse_agent_response_max_retries: 3
