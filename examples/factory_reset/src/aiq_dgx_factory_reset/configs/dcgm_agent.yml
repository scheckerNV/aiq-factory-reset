general:
  use_uvloop: true

functions:
  gpu_status:
    _type: gpu_status
  gpu_run_diagnostics:
    _type: gpu_run_diagnostics
  gpu_enable_health:
    _type: gpu_enable_health
  gpu_nvlink_status:
    _type: gpu_nvlink_status
  prom_stack_start:
    _type: prom_stack_start
  prom_query:
    _type: prom_query
  grafana_create_dashboard:
    _type: grafana_create_dashboard

llms:
  nim_llm:
    _type: nim
    model_name: nvidia/llama-3.3-nemotron-super-49b-v1
    temperature: 0.0
    max_tokens: 1024

  # Optional fallback if you don't have NIM:
  # openai_llm:
  #   _type: openai
  #   model_name: gpt-4o-mini
  #   max_tokens: 1024

workflow:
  _type: react_agent
  tool_names:
    - gpu_status
    - gpu_run_diagnostics
    - gpu_enable_health
    - gpu_nvlink_status
    - prom_stack_start
    - prom_query
    - grafana_create_dashboard
  llm_name: nim_llm
  verbose: true
  parse_agent_response_max_retries: 3
