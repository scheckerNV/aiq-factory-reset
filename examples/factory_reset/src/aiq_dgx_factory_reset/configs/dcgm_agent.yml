general:
  use_uvloop: true

functions:
  gpu_status:
    _type: aiq_dgx_factory_reset/gpu_status
  gpu_run_diagnostics:
    _type: aiq_dgx_factory_reset/gpu_run_diagnostics
  gpu_enable_health:
    _type: aiq_dgx_factory_reset/gpu_enable_health
  gpu_nvlink_status:
    _type: aiq_dgx_factory_reset/gpu_nvlink_status
  prom_stack_start:
    _type: aiq_dgx_factory_reset/prom_stack_start
  prom_query:
    _type: aiq_dgx_factory_reset/prom_query
  grafana_create_dashboard:
    _type: aiq_dgx_factory_reset/grafana_create_dashboard

llms:
  nim_llm:
    _type: openai
    model_name: nvidia/llama-3_3-nemotron-super-49b-v1_5
    temperature: 0.0
    max_tokens: 1024
    base_url: http://localhost:8000/v1

workflow:
  _type: tool_calling_agent
  tool_names:
    - gpu_status
    - gpu_run_diagnostics
    - gpu_enable_health
    - gpu_nvlink_status
    - prom_stack_start
    - prom_query
    - grafana_create_dashboard
  llm_name: nim_llm
  verbose: true
