general:
  use_uvloop: true

functions:
  gpu_status:
    _type: aiq_dgx_factory_reset/gpu_status
  gpu_run_diagnostics:
    _type: aiq_dgx_factory_reset/gpu_run_diagnostics
  gpu_enable_health:
    _type: aiq_dgx_factory_reset/gpu_enable_health
  gpu_nvlink_status:
    _type: aiq_dgx_factory_reset/gpu_nvlink_status
  prom_stack_start:
    _type: aiq_dgx_factory_reset/prom_stack_start
  prom_query:
    _type: aiq_dgx_factory_reset/prom_query
  grafana_create_dashboard:
    _type: aiq_dgx_factory_reset/grafana_create_dashboard
  # Test echo function for debugging
  test_echo:
    _type: test_echo

llms:
  # OpenAI LLM - you can set OPENAI_API_KEY or it will fail gracefully
  test_llm:
    _type: openai
    model_name: gpt-4o-mini
    max_tokens: 1024
    temperature: 0.0

workflow:
  _type: react_agent
  tool_names:
    - gpu_status
    - gpu_run_diagnostics
    - gpu_enable_health
    - gpu_nvlink_status
    - prom_stack_start
    - prom_query
    - grafana_create_dashboard
    - test_echo
  llm_name: test_llm
  verbose: true
  parse_agent_response_max_retries: 5
