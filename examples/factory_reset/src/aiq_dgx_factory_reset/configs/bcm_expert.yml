general:
  use_uvloop: true

functions:
  # BCM Documentation RAG Tool
  bcm_documentation_rag:
    _type: bcm_documentation_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/bcm_admin_manual/"
    offline_mode: true

llms:
  bcm_expert_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

# BCM Expert Agent Workflow
workflow:
  _type: tool_calling_agent
  tool_names:
    - bcm_documentation_rag
  llm_name: bcm_expert_llm
  verbose: true
  system_prompt: |
    You are a BCM expert. CRITICAL RULES:

    1. NEVER invent commands - only use procedures found in the documentation
    2. BCM operations require multiple steps across different cmsh contexts
    3. When documentation shows interface configuration, BMC settings, network setup - use ALL relevant steps
    4. If you can't find a complete procedure, say "Documentation doesn't contain complete steps"
    5. Always show the full command sequence with proper cmsh navigation

    BCM procedures typically involve:
    - Network configuration (network use ...)
    - Interface creation (interfaces add ...)
    - Settings configuration (set network, set ip)
    - Authentication setup (partition → bmcsettings)
    - Commits and validation
