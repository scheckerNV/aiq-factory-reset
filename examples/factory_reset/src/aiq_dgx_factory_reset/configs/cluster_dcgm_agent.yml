# Cluster DCGM Agent Configuration
# Provides cluster-wide DCGM analysis tools for BCM-managed GPU clusters.

general:
  use_uvloop: true

functions:
  cluster_gpu_status:
    _type: aiq_dgx_factory_reset/cluster_gpu_status
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1
    ssh_timeout: 30

  cluster_gpu_enable_health:
    _type: aiq_dgx_factory_reset/cluster_gpu_enable_health
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1
    ssh_timeout: 30

  cluster_gpu_health_check:
    _type: aiq_dgx_factory_reset/cluster_gpu_health_check
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1
    ssh_timeout: 45

  cluster_gpu_diagnostics:
    _type: aiq_dgx_factory_reset/cluster_gpu_diagnostics
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1
    ssh_timeout: 60
    dcgm_timeout: 180

  cluster_deploy_monitoring:
    _type: aiq_dgx_factory_reset/cluster_deploy_monitoring
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1
    ssh_timeout: 90

  cluster_create_dashboard:
    _type: aiq_dgx_factory_reset/cluster_create_dashboard
    cluster_host: bcm11-headnode
    cluster_user: hpcuser1

  # Include single-node tools for comparison
  gpu_status:
    _type: aiq_dgx_factory_reset/gpu_status

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.1
    max_tokens: 2000

workflow:
  _type: tool_calling_agent
  tool_names:
    - cluster_gpu_status
    - cluster_gpu_enable_health
    - cluster_gpu_health_check
    - cluster_gpu_diagnostics
    - cluster_deploy_monitoring
    - cluster_create_dashboard
    - gpu_status
  llm_name: nim_llm
  verbose: true
