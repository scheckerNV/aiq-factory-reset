# Network Agent workflow with integrated BCM Command Execution
# This extends your existing network_agent.yml to automatically execute BCM commands

general:
  use_uvloop: true

functions:
  # Existing BCM Documentation RAG Tool
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

  # Existing Networking Expert RAG
  networking_expert_rag:
    _type: aiq_dgx_factory_reset/networking_expert_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"

  # Existing Network Assessment Tool
  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    cluster_host: "schecker-testcluster"  # Updated to your cluster
    cluster_user: "root"
    timeout: 300

  # Existing Network Results Reader
  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader
    cluster_host: "schecker-testcluster"  # Updated to your cluster
    cluster_user: "root"
    results_directory: "/tmp/cluster_assessment_*"

  # NEW: Human-in-the-Loop Approval Function
  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "🔧 NETWORK FACTORY RESET COMMANDS - The following BCM commands will execute network changes on schecker-testcluster"

  # NEW: BCM Command Execution Tool
  bcm_executor:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "schecker-testcluster"  # Your cluster hostname
    cluster_user: "root"                   # Your cluster username
    timeout: 600                          # Longer timeout for network operations
    dry_run: false                        # Since you tested successfully, enable live execution
    coder_llm_name: qwen_coder           # Qwen2.5 for command validation
    hitl_approval_fn: hitl_code_approval

  # Enhanced React Agent with BCM Executor
  networking_react_agent:
    _type: react_agent
    tool_names:
      - networking_expert_rag
      - bcm_documentation_rag
      - network_assessment_tool
      - network_results_reader
      - bcm_executor  # NEW: Added BCM executor to the agent's tools
    llm_name: execution_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true

llms:
  # Existing Reasoning LLM
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  # Existing Execution LLM
  execution_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  # NEW: Qwen2.5 Coder for command validation
  qwen_coder:
    _type: nim
    model_name: nvidia/qwen2.5-coder-32b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: reasoning_agent
  llm_name: reasoning_llm
  augmented_fn: networking_react_agent
  verbose: true
  reasoning_prompt_template: |
    <think>
    I need to analyze this networking request for a DGX SuperPOD factory reset operation.

    Let me break down what I need to understand:

    1. CONTEXT ANALYSIS:
       - What type of networking operation is being requested?
       - Is this a complete factory reset, partial reset, or analysis?
       - What components of the network infrastructure are involved?
       - Are there any specific DGX nodes or network segments mentioned?

    2. INFORMATION REQUIREMENTS:
       - What documentation do I need to reference?
       - What current network state information is needed?
       - What are the dependencies and prerequisites?
       - What safety considerations are important?

    3. EXECUTION PLANNING:
       - What is the correct sequence of operations?
       - What network components need to be reset first?
       - How do I verify current state before making changes?
       - What validation steps are needed after each operation?
       - What are the rollback procedures if something goes wrong?

    4. COMMAND GENERATION AND EXECUTION:
       - After analyzing the network state, I need to generate appropriate BCM commands
       - These commands should be executed through the bcm_executor tool
       - The human will approve commands before execution
       - I should verify the results after execution

    5. RISK ASSESSMENT:
       - What are the potential impacts of network changes?
       - How do I minimize downtime?
       - What could go wrong and how to prevent it?
       - Are there any dependencies on external systems?

    6. OUTPUT PLANNING:
       - What specific information should I gather?
       - What BCM commands need to be generated and executed?
       - What validation steps should follow execution?
       - What documentation should be updated?

    Based on this analysis, I need to create a comprehensive plan that includes both analysis AND execution.
    </think>

    You are analyzing a networking request for DGX SuperPOD factory reset operations.

    Create a detailed execution plan that considers:
    - Network infrastructure components involved
    - Required documentation and configuration references
    - Step-by-step operational sequence
    - BCM command generation and execution
    - Safety considerations and validation steps
    - Dependencies and prerequisites

    Your plan should include BOTH analysis AND execution of the necessary network changes.

  instruction_prompt_template: |
    Based on the analysis above, execute this networking operation plan:

    REASONING ANALYSIS:
    {reasoning_output}

    ORIGINAL REQUEST: {input_text}

    EXECUTION INSTRUCTIONS:
    Using your networking expertise and available tools, systematically execute the planned approach.

    WORKFLOW STEPS:
    1. **Assessment Phase**: Gather current network state information
    2. **Analysis Phase**: Reference documentation and identify configuration gaps
    3. **Command Generation Phase**: Generate appropriate BCM commands to address issues
    4. **Execution Phase**: Use the bcm_executor tool to execute approved commands
    5. **Validation Phase**: Verify that changes were applied correctly

    IMPORTANT: After generating BCM commands from the documentation, use the bcm_executor tool to execute them.
    The bcm_executor will:
    - Validate commands with Qwen2.5 Coder
    - Present commands for human approval
    - Execute approved commands on schecker-testcluster
    - Provide execution results and next steps

    Focus on providing comprehensive, accurate networking guidance that follows best practices for DGX SuperPOD environments.
