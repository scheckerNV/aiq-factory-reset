general:
  use_uvloop: true

functions:
  # BCM Documentation RAG Tool with LlamaParse and Multi-Agent Workflow
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    max_tokens: 8192
    response_mode: "tree_summarize"
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

  networking_expert_rag:
    _type: aiq_dgx_factory_reset/networking_expert_rag
    max_tokens: 8192
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/networking_expert"
    persist_dir: "examples/factory_reset/storage/networking_index"

  network_assessment_tool:
    _type: aiq_dgx_factory_reset/network_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  network_results_reader:
    _type: aiq_dgx_factory_reset/network_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/cluster_assessment_*"

  # Human-in-the-Loop Approval Function
  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "The following BCM commands have been generated for your DGX cluster factory reset:"

  # Code Execution Tool with Qwen2.5 Coder and Human Approval
  code_execution_with_approval:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 600
    dry_run: false  # Set to true for validation only
    coder_llm_name: qwen_coder
    hitl_approval_fn: hitl_code_approval

  # Enhanced networking agent with code execution capability
  networking_react_agent_with_coder:
    _type: react_agent
    tool_names:
      - networking_expert_rag
      - bcm_documentation_rag
      - network_assessment_tool
      - network_results_reader
      - code_execution_with_approval
    llm_name: execution_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true
    system_prompt: |
      You are a DGX SuperPOD factory reset expert using ReAct methodology (Reasoning + Acting).

      **WORKFLOW SEQUENCE:**
      1. **Assessment**: Use networking_expert_rag and network_assessment_tool to understand current state
      2. **Analysis**: Use network_results_reader to analyze assessment data
      3. **Command Generation**: Use bcm_documentation_rag to generate corrective BCM commands
      4. **Execution**: Use code_execution_with_approval to validate and execute commands with human approval

      **EXECUTION PATTERN:**
      1. **Thought**: Analyze what you need to do
      2. **Action**: Use appropriate tools to gather information or execute commands
      3. **Observation**: Review the tool results carefully
      4. **Thought**: Plan your next step based on observations
      5. **Action**: Continue with additional tools or provide final answer

      **CRITICAL RULES:**
      - ALWAYS start with networking_expert_rag for understanding requirements
      - Use network_assessment_tool to gather current cluster state
      - Use network_results_reader to analyze assessment data
      - Generate BCM commands using bcm_documentation_rag
      - MUST use code_execution_with_approval for executing any commands
      - Provide comprehensive safety warnings before execution
      - Include validation steps after each operation

      **SAFETY REQUIREMENTS:**
      - Never execute commands without proper validation
      - Always explain the impact of each command
      - Provide rollback procedures when possible
      - Include proper sequencing information

      Key areas of expertise:
      - Network fabric configuration (management, storage, compute networks)
      - IP address allocation and VLAN assignments
      - BCM integration and network provisioning
      - DGX node connectivity and network interfaces
      - Network troubleshooting and state verification
      - Factory reset procedures for DGX systems
      - Code validation and execution safety

      Available tools: {tool_names}

      {tools}

llms:
  # Reasoning LLM
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 8192
    temperature: 0.1

  execution_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 8192
    temperature: 0.1

  # Qwen2.5 Coder 32B for code validation and execution
  qwen_coder:
    _type: nim
    model_name: qwen/qwen2.5-coder-32b-instruct  # Update this if the actual NIM model name differs
    max_tokens: 8192
    temperature: 0.1
    # Note: You may need to adjust the model_name based on the actual NIM deployment
    # Check available models with: aiq info components -t llm

workflow:
  _type: reasoning_agent
  llm_name: reasoning_llm
  augmented_fn: networking_react_agent_with_coder
  verbose: true
  reasoning_prompt_template: |
    <think>
    I need to analyze this networking request for a DGX SuperPOD factory reset operation with code execution capability.

    Let me break down what I need to understand:

    1. CONTEXT ANALYSIS:
       - What type of networking operation is being requested?
       - Is this a complete factory reset, partial reset, or analysis?
       - What components of the network infrastructure are involved?
       - Are there any specific DGX nodes or network segments mentioned?

    2. INFORMATION REQUIREMENTS:
       - What documentation do I need to reference?
       - What current network state information is needed?
       - What are the dependencies and prerequisites?
       - What safety considerations are important?

    3. EXECUTION PLANNING:
       - What is the correct sequence of operations?
       - What network components need to be reset first?
       - How do I verify current state before making changes?
       - What validation steps are needed after each operation?
       - What are the rollback procedures if something goes wrong?
       - How will I handle human approval for command execution?

    4. CODE EXECUTION CONSIDERATIONS:
       - What commands will need to be executed?
       - How will I validate commands before execution?
       - What safety checks are needed?
       - How will I present commands for human approval?

    5. RISK ASSESSMENT:
       - What are the potential impacts of network changes?
       - How do I minimize downtime?
       - What could go wrong and how to prevent it?
       - Are there any dependencies on external systems?

    6. OUTPUT PLANNING:
       - What specific information should I gather?
       - What format should the response be in?
       - Should I provide step-by-step procedures or analysis?
       - What level of detail is appropriate?

    Based on this analysis, I need to create a comprehensive plan for the networking expert to execute with code validation and human approval.
    </think>

    You are analyzing a networking request for DGX SuperPOD factory reset operations with code execution capability.

    Create a detailed execution plan that considers:
    - Network infrastructure components involved
    - Required documentation and configuration references
    - Step-by-step operational sequence
    - Safety considerations and validation steps
    - Dependencies and prerequisites
    - Code execution workflow with human approval
    - Rollback procedures

    Provide a clear, actionable plan for the networking expert to follow.

  instruction_prompt_template: |
    Based on the analysis above, execute this networking operation plan with code execution capability:

    REASONING ANALYSIS:
    {reasoning_output}

    ORIGINAL REQUEST: {input_text}

    EXECUTION INSTRUCTIONS:
    Using your networking expertise and available tools, systematically execute the planned approach with integrated code execution.

    1. **Assessment Phase**: Gather all necessary information about current network state
    2. **Analysis Phase**: Reference relevant documentation for proper procedures
    3. **Command Generation**: Generate specific, actionable BCM commands
    4. **Validation Phase**: Use Qwen2.5 Coder for command validation
    5. **Approval Phase**: Present commands for human approval
    6. **Execution Phase**: Execute approved commands with safety monitoring
    7. **Verification Phase**: Validate results and provide status

    **SAFETY REQUIREMENTS:**
    - Include proper safety warnings and validation steps
    - Ensure network operations are sequenced correctly
    - Provide comprehensive explanations for all commands
    - Include rollback procedures where applicable

    Focus on providing comprehensive, accurate networking guidance that follows best practices for DGX SuperPOD environments with integrated code execution capability.
