general:
  use_uvloop: true

# === NEW: MODULAR RAG COMPONENTS ===
embedders:
  nvidia_embedder:
    _type: nim
    model_name: nvidia/nv-embedqa-e5-v5
    truncate: "END"

retrievers:
  dgx_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "dgx_docs"
    embedding_model: nvidia_embedder
    top_k: 5

  bcm_retriever:
    _type: milvus_retriever
    uri: http://localhost:19530
    collection_name: "bcm_docs"
    embedding_model: nvidia_embedder
    top_k: 5

functions:
  # === NEW: RAG TOOLS USING RETRIEVERS ===
  dgx_expert_rag:
    _type: aiq_retriever
    retriever: dgx_retriever
    topic: "Search DGX hardware documentation and operational guidance"

  bcm_documentation_rag:
    _type: aiq_retriever
    retriever: bcm_retriever
    topic: "Search BCM (Bright Cluster Manager) documentation and commands"

  # === DOCUMENT INGESTION TOOLS (NEW) ===
  dgx_document_ingest:
    _type: aiq_dgx_factory_reset/dgx_document_ingest
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/dgx_expert"
    retriever_name: dgx_retriever
    chunk_size: 1024
    chunk_overlap: 200
    force_reindex: false

  bcm_document_ingest:
    _type: aiq_dgx_factory_reset/bcm_document_ingest
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    retriever_name: bcm_retriever
    chunk_size: 1024
    chunk_overlap: 200
    force_reindex: false

  # === EXISTING TOOLS (UNCHANGED) ===
  node_assessment_tool:
    _type: aiq_dgx_factory_reset/node_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 300

  node_results_reader:
    _type: aiq_dgx_factory_reset/node_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/node_assessment_*"

  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "Review the following BCM commands for DGX reset (approve yes/no)"

  bcm_executor:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 600
    dry_run: true
    hitl_approval_fn: hitl_code_approval

  dgx_react_agent:
    _type: react_agent
    tool_names:
      - dgx_expert_rag        # Now uses AIQ retriever
      - bcm_documentation_rag # Now uses AIQ retriever
      - node_assessment_tool
      - node_results_reader
      - hitl_code_approval
      - bcm_executor
    llm_name: execution_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true

  dgx_orchestrator:
    _type: aiq_dgx_factory_reset/dgx_orchestrator
    reasoning_llm_name: reasoning_llm
    react_agent_fn: dgx_react_agent
    executor_fn: bcm_executor

llms:
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  execution_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: reasoning_agent
  llm_name: reasoning_llm
  augmented_fn: dgx_orchestrator
  verbose: true
  reasoning_prompt_template: |
    <think>
    You are analyzing a DGX SuperPOD request.

    Determine if it is:
    - A diagnostic/status request (information only)
    - An action/execution request (changes to be made)
    - A factory reset request (requires full reset of nodes)

    For all requests, identify:
    1. CONTEXT ANALYSIS:
       - DGX components or nodes involved
       - Any network segments mentioned
       - Clues about the user's intent

    2. INFORMATION REQUIREMENTS:
       - Documentation, procedures, or prior results needed
       - Current node or cluster state information required

    3. OUTPUT PLANNING:
       - For diagnostics: summarize observed state and provide recommendations
       - For general actions: list commands / changes needed
       - (If classified as reset_nodes, the Orchestrator will insert additional reset-specific planning later)
    </think>

    You are analyzing a DGX SuperPOD request. Classify it accordingly and give a concise, actionable plan.
    Avoid assuming a reset unless the request explicitly indicates it.
  instruction_prompt_template: |
    Based on the analysis above, this is the reasoning analysis:

    REASONING ANALYSIS:
    {reasoning_output}

    ORIGINAL REQUEST: {input_text}

    INSTRUCTIONS:
    Use your DGX SuperPOD expertise and available tools to address the request.
    1. For diagnostics: gather relevant data, summarize state, provide recommendations.
    2. For actions: determine safe sequence, validation, and execution steps.
    3. If the Orchestrator classifies this as a reset_nodes request, additional reset-specific steps will follow.

    Ensure guidance is clear, accurate, and best-practice aligned for DGX SuperPOD environments.
