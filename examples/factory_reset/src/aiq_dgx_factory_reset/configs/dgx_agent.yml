general:
  use_uvloop: true

functions:
  bcm_documentation_rag:
    _type: aiq_dgx_factory_reset/bcm_documentation_rag
    docs_path: "examples/factory_reset/src/aiq_dgx_factory_reset/docs/BCM_expert"
    persist_dir: "examples/factory_reset/storage/bcm_index"

  # assess state of nodes in cluster
  node_assessment_tool:
    _type: aiq_dgx_factory_reset/node_assessment_tool
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 180

  # read results of node assessment
  node_results_reader:
    _type: aiq_dgx_factory_reset/node_results_reader
    cluster_host: "localhost"
    cluster_user: "root"
    results_directory: "/tmp/node_assessment_*"

  hitl_code_approval:
    _type: aiq_dgx_factory_reset/hitl_code_approval
    prompt: "Review the following BCM commands for DGX reset (approve yes/no)"

  # execute produced BCM commands with approval
  bcm_executor:
    _type: aiq_dgx_factory_reset/code_execution_with_approval
    cluster_host: "localhost"
    cluster_user: "root"
    timeout: 600
    dry_run: false
    hitl_approval_fn: hitl_code_approval

  dgx_react_agent:
    _type: react_agent
    tool_names:
      - bcm_documentation_rag
      - node_assessment_tool
      - node_results_reader
      - hitl_code_approval
      - bcm_executor
    llm_name: execution_llm
    verbose: true
    parse_agent_response_max_retries: 3
    retry_agent_response_parsing_errors: true

llms:
  reasoning_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

  execution_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    max_tokens: 4096
    temperature: 0.1

workflow:
  _type: aiq_dgx_factory_reset/dgx_orchestrator
  reasoning_llm_name: reasoning_llm
  executor_fn: bcm_executor
  verbose: true
  commands_prompt: |
    You are a Bright Cluster Manager (BCM) SRE. Using the CONTEXT (assessment/analysis/guidance), do the following
    mission CRITICAL steps:

    1) Identify nodes not in a good state (e.g., DOWN, unreachable, draining, error, failed DCGM/health).
    2) For each affected node, produce the minimal, safe corrective sequence to return it to a good/UP state.
       Prefer non-destructive steps first (drain/disable, clear errors, reboot). Escalate to reinstall/reimage
       only if indicated by CONTEXT.
    3) Use actual node and image names from CONTEXT. Do not invent values or use placeholders.
       If a value is unknown, first emit a discovery command (e.g., show softwareimage) and only then
       the corrective command that uses the discovered value.

    CRITICAL CONSTRAINTS:
    - Only generate commands for nodes listed in ALLOWED_NODES. If ALLOWED_NODES is "(not specified)",
      operate only on nodes explicitly identified as unhealthy in RESULTS.
    - NEVER include head/management nodes unless the user explicitly says so.
    - Use the hostname field exactly as shown in RESULTS. NEVER use IP addresses in device use commands.

    Output format (must match exactly):
    - First print a section header: Rationale:
      - Then 3–5 concise bullets referencing snippets from CONTEXT (no raw dumps).
    - Then print a section header: Commands:
      - Then output only bare command lines. Each line must be exactly: cmsh -c "<command>"
      - Use ASCII double quotes. No bullets, numbering, code fences, prompts, comments, or trailing text.
      - One command per line.

    Command examples (correct patterns):
    - cmsh -c "device use node001; show"
    - cmsh -c "device use node001; power reset"
    - cmsh -c "softwareimage use dgx-image; device use node001; set installmode FULL; commit; reboot"
    - cmsh -c "device use node001; drain --setactions reboot"

    NEVER produce:
    - cmsh -c "device use 10.141.0.1; ..." (IP addresses)
    - cmsh -c "device use node001; show status" (incorrect verb)
    - Commands targeting head/mgmt nodes

    Command rules:
    - Commands must be runnable as-is on this cluster: use real node hostnames from RESULTS.
    - Use correct cmsh patterns (device; device use <hostname>; <action>).
    - If reinstall/reimage is required and the image name isn't known from CONTEXT, first discover it
      (e.g., cmsh -c "device use <hostname>; show softwareimage") or select a valid image shown in CONTEXT.
    - Include per-node verification (e.g., show, dcgm) after corrective actions.
    - Avoid cluster-wide changes; scope actions to affected nodes only.
    - If all nodes are healthy, output no commands in the Commands section.

    CONTEXT
    ---
    {context}
    ---
