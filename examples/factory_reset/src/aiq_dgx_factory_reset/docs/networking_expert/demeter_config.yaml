          hostname: "UFM-S-2"
          ip: "10.184.165.221"

# ==============================================================================
# CLUSTER-WIDE POLICIES
# ==============================================================================
policies:
  # Firmware Update Strategy
  firmware_updates:
    strategy: "rolling"
    max_concurrent_nodes: 2
    batch_size: 4
    inter_batch_delay: "30m"
    rollback_on_failure: true
    maintenance_windows:
      - day: "saturday"
        start_time: "02:00"
        duration_hours: 6

  # Factory Reset Policies
  factory_reset:
    triggers:
      - "unrecoverable_boot_failure"
      - "corrupted_filesystem"
      - "firmware_corruption"
      - "manual_request"
    safety_checks:
      - "verify_bcm_enrollment"
      - "backup_critical_data"
      - "confirm_network_config"
    max_concurrent_resets: 1

  # Health Monitoring
  monitoring:
    health_check_interval: "60s"
    cluster_health_threshold: 0.95
    node_isolation_threshold: 3
    alert_escalation_time: "15m"

  # Network Policies
  network:
    infiniband:
      fabric_manager_enabled: true
      auto_port_configuration: true
      link_monitoring: true
      error_threshold: 0.001
    ethernet:
      spanning_tree_enabled: true
      vlan_isolation: true

# ==============================================================================
# AUTOMATION WORKFLOWS
# ==============================================================================
automation:
  # Node Lifecycle Management
  node_lifecycle:
    provision:
      - "power_on"
      - "pxe_boot"
      - "os_install"
      - "driver_install"
      - "bcm_enroll"
      - "health_check"

    factory_reset:
      - "assess_node_state"
      - "backup_configuration"
      - "bcm_category_reset"
      - "verify_provisioning"
      - "network_configuration"
      - "health_validation"

  # Cluster Operations
  cluster_operations:
    rolling_update:
      - "select_batch"
      - "drain_workloads"
      - "update_firmware"
      - "reboot_nodes"
      - "validate_cluster"
      - "proceed_next_batch"

# ==============================================================================
# SECURITY CONFIGURATION
# ==============================================================================
security:
  authentication:
    method: "kerberos"
    domain: "demeter.local"
    certificate_authority: "internal_ca"

  access_control:
    admin_groups:
      - "demeter_admins"
      - "datacenter_ops"
    read_only_groups:
      - "demeter_users"
      - "monitoring_team"

  network_security:
    fabric_isolation: true
    encrypted_management: true
    ipmi_access_control: true

  audit:
    enabled: true
    retention_days: 180
    log_level: "info"
    compliance_standard: "enterprise"

# ==============================================================================
# CREDENTIALS REFERENCES
# ==============================================================================
credentials:
  bcm_admin:
    type: "vault_reference"
    vault_path: "secret/demeter/bcm_admin"

  node_bmc:
    type: "vault_reference"
    vault_path: "secret/demeter/node_bmc"

  ufm_compute_creds:
    type: "vault_reference"
    vault_path: "secret/demeter/ufm_compute"
    username: "root"

  switch_management:
    type: "vault_reference"
    vault_path: "secret/demeter/switch_mgmt"

# ==============================================================================
# OPERATIONAL PROCEDURES
# ==============================================================================
procedures:
  emergency_shutdown:
    trigger_conditions:
      - "facility_power_loss"
      - "cooling_system_failure"
      - "security_incident"
    shutdown_order:
      1: "user_workloads"
      2: "storage_systems"
      3: "compute_nodes"
      4: "network_infrastructure"
      5: "management_systems"

  disaster_recovery:
    rpo_target: "1h"
    rto_target: "4h"
    backup_systems:
      - "bcm_configuration"
      - "user_data"
      - "system_configurations"

  capacity_planning:
    monitoring_metrics:
      - "node_utilization"
      - "network_bandwidth"
      - "storage_capacity"
      - "power_consumption"
    scaling_triggers:
      - utilization: "> 80%"
        duration: "7d"
        action: "capacity_expansion"
