# This is the Demeter DGX H100 BasePOD Cluster's Desired State Configuration
# This is a YAML file that defines the desired state of the cluster

metadata:
  version: "1.0.0"
  description: "Demeter DGX H100 BasePOD Cluster Desired State"
  created: "2025-01-26"
  environment: "production"
  cluster_name: "demeter"
  total_nodes: 31

# ==============================================================================
# CLUSTER CONFIGURATION
# ==============================================================================
cluster:
  name: "demeter"
  type: "DGX_BasePOD"
  location: "data-center"

  # BCM Configuration - assumes this stays the same for the life of the cluster
  bcm:
    enabled: true
    shared_ip: "10.184.164.50"
    head_nodes:
      primary:
        hostname: "demeter-mgmt-1"
        ip: "10.184.164.51"
        bmc_ip: "10.184.165.51"
      secondary:
        hostname: "demeter-mgmt-2"
        ip: "10.184.164.52"
        bmc_ip: "10.184.165.52"
    domain: "demeter.local"
    default_image: "default-image-kdump-nvidia-smi"

# ==============================================================================
# NETWORK FABRIC DEFINITIONS
# ==============================================================================
network_fabrics:
  # Management Network (In-band)
  management:
    name: "managementnet"
    aliases: ["internalnet"]
    subnet: "10.184.164.0/24"
    gateway: "10.184.164.1"
    dns_servers: ["103.247.36.36", "103.247.37.37"]
    vlan: 164
    usable_range: "10.184.164.4-254"

  # Out-of-Band Management (IPMI-1) - Control Plane Management
  oob_management_1:
    name: "oobmanagementnet"
    aliases: ["ipminet1"]
    subnet: "10.184.165.0/25"
    gateway: "10.184.165.1"
    dns_servers: ["103.247.36.36", "103.247.37.37"]
    usable_range: "10.184.165.4-126"
    description: "IPMI-1 - Control Plane Management"

  # Out-of-Band Management (IPMI-2) - DGX Management
  oob_management_2:
    name: "oobmanagementnet2"
    aliases: ["ipminet2"]
    subnet: "10.184.165.128/25"
    gateway: "10.184.165.129"
    dns_servers: ["103.247.36.36", "103.247.37.37"]
    usable_range: "10.184.165.131-254"
    description: "IPMI-2 - DGX Management"

  # Compute Fabric (InfiniBand)
  compute_fabric:
    name: "computenet"
    aliases: ["dgxnet"]
    subnet: "100.126.0.0/16"
    gateway: null
    usable_range: "100.126.0.1-255.254"
    fabric_type: "infiniband"
    description: "High-performance compute interconnect"

  # Storage Fabric (InfiniBand)
  storage_fabric:
    name: "storagenet"
    subnet: "100.127.0.0/16"
    gateway: null
    usable_range: "100.127.0.1-255.254"
    fabric_type: "infiniband"
    description: "Storage interconnect"

# ==============================================================================
# DGX NODE DEFINITIONS (31 nodes)
# ==============================================================================
# NOTE: Storage fabric interfaces not specified in source spreadsheet
# DGX nodes may have additional InfiniBand interfaces for storage connectivity
# to the 100.127.0.0/16 storage fabric that would need to be defined
nodes:
  # Standard references for all DGX nodes
  dgx_power: &dgx_power
    desired_state: "on"
    power_policy: "restore_previous"
    auto_power_on: true

  dgx_firmware: &dgx_firmware
    host_bios: "01.06.01"
    host_bmc: "24.11.05"
    erot_bios: "00.04.0052.0000_n00"
    erot_bmc: "00.04.0052.0000_n00"
    gpu_firmware: "97.00.4C.00.1C"
    gpu_inforom: "G525.0220.00.03"
    cx7_nic_firmware: "32.42.1000"
    cx7_card_firmware: "28.42.1000"
    auto_update: false
    update_schedule: "maintenance_window"

  dgx_software: &dgx_software
    os_image: "dgx-os-5.3.0"
    kernel_version: "5.4.0-150-generic"
    nvidia_driver: "latest"
    cuda_version: "12.0"
    container_runtime: "docker"
    bcm_enrolled: true
    monitoring_enabled: true

  dgx_health: &dgx_health
    temperature_thresholds:
      gpu_critical: 85
      gpu_warning: 80
      cpu_critical: 85
      cpu_warning: 75
    power_thresholds:
      max_power_watts: 10000
      warning_power_watts: 9000
    memory_thresholds:
      memory_usage_critical: 95
      memory_usage_warning: 85

