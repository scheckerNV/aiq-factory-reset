# ==============================================================================
# CLUSTER-WIDE POLICIES
# ==============================================================================
policies:
  # Health Monitoring
  monitoring:
    health_check_interval: "60s"
    cluster_health_threshold: 0.60  # 6 out of 10 nodes healthy
    node_isolation_threshold: 3
    alert_escalation_time: "15m"

  # Factory Reset Policies
  factory_reset:
    triggers:
      - "unrecoverable_boot_failure"
      - "corrupted_filesystem"
      - "health_check_failure"
      - "manual_request"
    safety_checks:
      - "verify_bcm_enrollment"
      - "backup_critical_data"
      - "confirm_network_config"
    max_concurrent_resets: 2

  # Network Policies
  network:
    ethernet:
      spanning_tree_enabled: false
      vlan_isolation: false
    connectivity_monitoring: true
    default_route_validation: true

# ==============================================================================
# AUTOMATION WORKFLOWS
# ==============================================================================
automation:
  # Node Lifecycle Management
  node_lifecycle:
    provision:
      - "power_on"
      - "network_configuration"
      - "os_install"
      - "bcm_enroll"
      - "health_check"

    factory_reset:
      - "assess_node_state"
      - "backup_configuration"
      - "bcm_category_reset"
      - "verify_provisioning"
      - "network_configuration"
      - "health_validation"

# ==============================================================================
# SECURITY CONFIGURATION
# ==============================================================================
security:
  authentication:
    method: "local"
    domain: "cluster.local"

  access_control:
    admin_access: true
    ssh_enabled: true
    external_access_points:
      - interface: "192.168.200.227"
        ports: [22]

  network_security:
    internal_communication: true
    service_isolation: false

# ==============================================================================
# OPERATIONAL PROCEDURES
# ==============================================================================
procedures:
  emergency_shutdown:
    trigger_conditions:
      - "facility_power_loss"
      - "security_incident"
    shutdown_order:
      1: "compute_nodes"
      2: "head_node"

  disaster_recovery:
    rpo_target: "1h"
    rto_target: "2h"
    backup_systems:
      - "bcm_configuration"
      - "node_configurations"

