---
apiVersion: v1
kind: Secret
metadata:
  name: aiq-factory-reset-secrets
  namespace: default
type: Opaque
stringData:
  NVIDIA_API_KEY: "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"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiq-factory-reset-config
  namespace: default
data:
  AIQ_CONFIG_FILE: "/workspace/examples/factory_reset/src/aiq_dgx_factory_reset/configs/simple_network.yml"
  AIQ_LOG_LEVEL: "INFO"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiq-factory-reset
  namespace: default
  labels:
    app: aiq-factory-reset
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiq-factory-reset
  template:
    metadata:
      labels:
        app: aiq-factory-reset
    spec:
      containers:
      - name: factory-reset
        image: localhost:5000/aiq-factory-reset:latest
        imagePullPolicy: Never  # Use local image, don't pull from registry
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: NVIDIA_API_KEY
          valueFrom:
            secretKeyRef:
              name: aiq-factory-reset-secrets
              key: NVIDIA_API_KEY
        - name: AIQ_CONFIG_FILE
          valueFrom:
            configMapKeyRef:
              name: aiq-factory-reset-config
              key: AIQ_CONFIG_FILE
        - name: AIQ_LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: aiq-factory-reset-config
              key: AIQ_LOG_LEVEL
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /docs
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: aiq-factory-reset-service
  namespace: default
  labels:
    app: aiq-factory-reset
spec:
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800  # Access via any cluster node on port 30800
    name: http
  selector:
    app: aiq-factory-reset

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aiq-factory-reset-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: factory-reset.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aiq-factory-reset-service
            port:
              number: 8000
